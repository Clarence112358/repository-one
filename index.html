<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猜猜我是谁 - 智能中国古代人物篇</title>
    <style>
        /* 全局盒模型优化，防止宽度溢出 */
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            padding: 15px 10px;
            margin: 0;
        }
        
        .container { 
            background: white; 
            padding: 20px 15px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
        }
        
        h1 { text-align: center; color: #333; font-size: 1.5rem; margin-top: 5px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 15px; 
            width: 100%; 
            margin-top: 10px;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        input[type="text"], select { 
            width: 100%; 
            padding: 12px 10px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 15px; 
        }
        
        #chat-box { 
            height: 350px; 
            overflow-y: auto; 
            background: #fafafa; 
            border: 1px solid #eee; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
        }
        
        .msg { 
            max-width: 85%; 
            padding: 10px 14px; 
            border-radius: 15px; 
            word-wrap: break-word; 
            line-height: 1.4;
        }
        .msg.user { background: #d1e7dd; align-self: flex-end; border-bottom-right-radius: 2px;}
        .msg.ai { background: #f8d7da; align-self: flex-start; border-bottom-left-radius: 2px;}
        .msg.sys { background: #e2e3e5; align-self: center; font-size: 0.85em; color: #666; border-radius: 5px; text-align: center;}
        
        .hidden { display: none; }
        
        .filter-row { display: flex; gap: 10px; margin-bottom: 10px;}
        .filter-row > div { flex: 1; }
        
        .flex-row { display: flex; gap: 10px; align-items: center;}
        .flex-row button { width: auto; margin-top: 0; white-space: nowrap;}
        .flex-row input { margin-top: 0;}

        @media (max-width: 480px) {
            .filter-row { flex-direction: column; gap: 5px; }
            .flex-row { flex-direction: column; align-items: stretch; }
            .flex-row button { width: 100%; margin-top: 5px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤔 猜猜我是谁</h1>

    <!-- API Key 输入区域 -->
    <div id="api-key-section" class="section" style="background: #fff3cd; border-color: #ffeeba;">
        <label style="font-weight: bold; color: #856404; font-size: 14px;">🔑 填入你的 DeepSeek API Key：</label>
        <input type="text" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxxxxx" style="border: 1px solid #ccc;">
        <p style="font-size: 12px; color: #856404; margin-top: 8px; margin-bottom: 0;">*Key仅保存在你手机本地，不会上传。填好后即可开始游戏！</p>
    </div>

    <!-- 设置区域 -->
    <div id="setup-section" class="section">
        <h3>1. 设定人物</h3>
        
        <div style="background: #f9f9f9; padding: 12px; border-radius: 5px; margin-bottom: 15px;">
            <p style="margin-top: 0; font-weight: bold; font-size: 14px; color: #555;">⚙️ AI 机选条件设置</p>
            
            <div class="filter-row">
                <div>
                    <label style="font-size: 14px;">身份：</label>
                    <select id="identity-select">
                        <option value="不限">不限</option>
                        <option value="皇帝、君主">仅限皇帝、君主</option>
                        <option value="非皇帝、君主">非皇帝、君主(文臣武将等)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 14px;">知名度：</label>
                    <select id="popularity-select">
                        <option value="不限">不限</option>
                        <option value="热门">热门</option>
                        <option value="中等">中等</option>
                        <option value="冷门">冷门</option>
                        <option value="更冷门">骨灰级冷门</option>
                    </select>
                </div>
            </div>
            <button id="random-btn" onclick="aiRandomPick()">🎲 AI 智能机选</button>
        </div>

        <hr style="border: 0.5px solid #eee; margin: 20px 0;">
        
        <button style="background: #6c757d;" onclick="toggleCustomPick()">✍️ 自定义设定 (我要考别人)</button>
        <div id="custom-pick-area" class="hidden">
            <input type="text" id="custom-name" placeholder="输入你想设定的人物，如：李白">
            <button onclick="customPick()">确定设定</button>
        </div>
    </div>

    <!-- 游戏区域 -->
    <div id="game-section" class="section hidden">
        <h3 id="game-status" style="margin-top: 0;">游戏进行中...</h3>
        
        <div id="chat-box"></div>

        <div>
            <input type="text" id="question-input" placeholder="输入你的问题（如：他是唐朝人吗？）">
            <button id="ask-btn" onclick="askQuestion()">提问</button>
        </div>

        <hr style="border: 0.5px solid #eee; margin: 15px 0;">

        <!-- 猜答案区 -->
        <div class="flex-row">
            <input type="text" id="guess-input" placeholder="我猜他是...(直接写名字)">
            <button id="guess-btn" style="background: #007bff;" onclick="makeGuess()">猜测</button>
        </div>
        
        <button style="background: #dc3545;" onclick="revealAnswer()">认输并看答案</button>
    </div>
</div>

<script>
    const API_URL = "https://api.deepseek.com/v1/chat/completions"; 
    const MODEL_NAME = "deepseek-reasoner"; 
    
    let targetCharacter = "";
    let isGameOver = false;

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem("my_deepseek_key");
        if(savedKey) {
            document.getElementById("apiKeyInput").value = savedKey;
        }
    });

    function getApiKey() {
        const key = document.getElementById("apiKeyInput").value.trim();
        if (!key) {
            alert("请先在最上方填写你的 DeepSeek API Key！");
            return null;
        }
        localStorage.setItem("my_deepseek_key", key); 
        return key;
    }

    // AI 根据维度随机抽卡
    async function aiRandomPick() {
        const userKey = getApiKey();
        if (!userKey) return; 

        const identity = document.getElementById('identity-select').value;
        const popularity = document.getElementById('popularity-select').value;
        const btn = document.getElementById('random-btn');
        
        btn.disabled = true;
        btn.innerText = "正在让 AI 翻史书挑选人物...";

        // 1. 动态决定基础范围（是否受限于中学课本）
        let scopePrompt = "";
        if (popularity === "热门" || popularity === "中等" || popularity === "不限") {
            scopePrompt = "请在【中学语文、历史、政治课程】里出现过（不一定是课标考纲要求记住的）的中国古代人物中挑选。";
        } else {
            scopePrompt = "请在【浩瀚的中国古代正史记载】中挑选。不需要局限于中学课本，必须放开眼界去寻找。";
        }

        // 2. 准备初始标签池
        let allLabels = [
            "先秦（含夏商周、春秋战国）",
            "秦汉三国",
            "两晋南北朝与五代十国",
            "隋唐",
            "两宋",
            "明清",
            "非汉族（如匈奴、突厥、契丹、女真、蒙古、党项、吐蕃等少数民族或政权人物）"
        ];

        // 3. 按照规则精准裁剪标签池
        // 规则A：热门 -> 移除“非汉族”
        // 规则B：非帝王君主 + (热门或中等) -> 移除“非汉族”
        if (popularity === '热门' || (identity === '非皇帝、君主' && (popularity === '热门' || popularity === '中等'))) {
            allLabels = allLabels.filter(label => !label.includes("非汉族"));
        }

        // 规则C：皇帝君主 + 热门 -> 移除“两晋南北朝与五代十国”
        if (identity === '皇帝、君主' && popularity === '热门') {
            allLabels = allLabels.filter(label => !label.includes("两晋南北朝与五代十国"));
        }

        // 4. 【核心改动】由代码原生随机生成最终的一个标签！
        const randomIndex = Math.floor(Math.random() * allLabels.length);
        const selectedLabel = allLabels[randomIndex];

        // 5. 组合最终发给AI的Prompt
        let pickPrompt = `你现在是一个历史游戏的发牌员。${scopePrompt}
请你必须严格同时符合以下三个条件，挑选一位具体的人物：
1. 身份：${identity === '不限' ? '任意身份皆可' : identity}
2. 知名度：${popularity === '不限' ? '任意可见度皆可' : popularity} （中等指课本学过但平时不常提起的；冷门指没上过课本但资深历史迷知道的；更冷门指史书里极其生僻边缘、只考查历史系研究生的级别）
3. 历史时期/范围：必须属于【${selectedLabel}】\n\n`;

        // 6. 针对性提示（只在抽中特定范围时才加入，进一步缩减无用Prompt）
        if ((identity === '皇帝、君主' || identity === '不限') && selectedLabel.includes("先秦")) {
            pickPrompt += `💡 提示：设定的身份包含君主且时代为先秦，请记住君王不仅包括尧舜禹、商汤、周文王，还包括春秋五霸、战国七雄的君主。\n`;
        }
        if ((identity === '皇帝、君主' || identity === '不限') && selectedLabel.includes("非汉族")) {
            pickPrompt += `💡 提示：设定的身份包含君主且在非汉族游牧范畴，可挑选单于、可汗、赞普、大汗等头衔的人物。\n`;
        }

        // 结尾严厉限制
        pickPrompt += `\n【极度重要】：选好后，请直接输出该人物的姓名，绝对不要输出任何标点符号、前缀、后缀、朝代或其他解释性文字。只有名字！`;

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${userKey}` 
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [{ role: "user", content: pickPrompt }],
                    temperature: 0.8 // 稍微调低一点温度，因为限定条件极其具体了
                })
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            
            let aiGeneratedName = data.choices[0].message.content.trim();
            aiGeneratedName = aiGeneratedName.replace(/[。！!.,\s]/g, ''); 

            if(!aiGeneratedName) throw new Error("AI未能成功返回名字");

            targetCharacter = aiGeneratedName;
            
            startGame();
            console.log(`[开发日志] 代码抽中的时代标签是: 【${selectedLabel}】`);
            console.log(`[开发日志] AI最终交卷的人物是:`, targetCharacter);

        } catch (error) {
            alert("召唤AI失败，请检查API Key是否正确，或检查网络。");
            console.error(error);
        } finally {
            btn.disabled = false;
            btn.innerText = "🎲 AI 智能机选";
        }
    }

    function toggleCustomPick() {
        document.getElementById('custom-pick-area').classList.toggle('hidden');
    }

    function customPick() {
        const name = document.getElementById('custom-name').value.trim();
        if(!name) { alert("请输入人物名字！"); return; }
        targetCharacter = name;
        startGame();
    }

    function startGame() {
        isGameOver = false;
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('api-key-section').classList.add('hidden'); 
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('chat-box').innerHTML = "";
        addMessage("sys", "游戏开始！AI已将人物藏在心中。你可以开始提问了。");
    }

    function addMessage(type, text) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    async function askQuestion() {
        if(isGameOver) return;
        const input = document.getElementById('question-input');
        const question = input.value.trim();
        if(!question) return;

        addMessage("user", "问: " + question);
        input.value = "";
        
        const askBtn = document.getElementById('ask-btn');
        askBtn.disabled = true;
        askBtn.innerText = "思考中...";

        try {
            const answer = await callLLMForAnswer(question);
            addMessage("ai", "答: " + answer);
        } catch (error) {
            addMessage("sys", "请求大模型失败，请检查网络或Key余额。");
            console.error(error);
        }

        askBtn.disabled = false;
        askBtn.innerText = "提问";
    }

    async function callLLMForAnswer(question) {
        const userKey = getApiKey();
        if (!userKey) throw new Error("未填写API Key");

        const systemPrompt = `你现在是一个“猜人物”游戏的裁判。
当前设定的中国古代人物是：【${targetCharacter}】。
玩家会向你提出关于这个人物的问题。你需要根据历史事实进行判断。
你的回答受到极严格的限制，你只能且必须输出以下三个词组中的一个，绝不能包含任何多余的标点符号或文字：
- 如果玩家说的符合事实，输出：是
- 如果玩家说的不符合事实，输出：不是
- 如果玩家说的部分符合，或者历史上有争议，输出：是也不是`;

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${userKey}` 
            },
            body: JSON.stringify({
                model: MODEL_NAME,
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: question }
                ],
                temperature: 0.1
            })
        });

        const data = await response.json();
        let reply = data.choices[0].message.content.trim();
        
        reply = reply.replace(/[。！!.,]/g, ''); 
        if(!["是", "不是", "是也不是"].includes(reply)) {
            if(reply.includes("是也不是")) return "是也不是";
            if(reply.includes("不是")) return "不是";
            if(reply.includes("是")) return "是";
            return "是也不是";
        }

        return reply;
    }

    function makeGuess() {
        if(isGameOver) return;
        const guessInput = document.getElementById('guess-input');
        const guess = guessInput.value.trim();
        if(!guess) return;

        addMessage("user", "我猜他是：" + guess);
        guessInput.value = "";

        if(guess.includes(targetCharacter) || targetCharacter.includes(guess)) {
            addMessage("sys", `🎉 恭喜你猜对了！正确答案就是【${targetCharacter}】！`);
            endGame();
        } else {
            addMessage("ai", "不对哦，继续猜！");
        }
    }

    function revealAnswer() {
        if(isGameOver) return;
        addMessage("sys", `游戏结束。正确答案是【${targetCharacter}】。`);
        endGame();
    }

    function endGame() {
        isGameOver = true;
        document.getElementById('ask-btn').disabled = true;
        document.getElementById('guess-btn').disabled = true;
        document.getElementById('game-status').innerText = "游戏结束，请刷新页面重新开始。";
    }

    document.getElementById("question-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault(); 
            askQuestion();
        }
    });
    document.getElementById("guess-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            makeGuess();
        }
    });
</script>
</body>
</html>
